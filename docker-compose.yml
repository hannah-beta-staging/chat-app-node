version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-docker.io/library/mongo:latest@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    depends_on:
      - goof-mongo
  goof-mongo:
    container_name: goof-mongo
    image: mongo
    ports:
      - "27017:27017"
